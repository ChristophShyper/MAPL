name: "Trigger CircleCI Pipeline on Release"
on:
  workflow_dispatch:
jobs:
  trigger-circleci:
    runs-on: ubuntu-slim
    steps:
      - name: CircleCI Trigger on Release
        id: docker-build
        uses: CircleCI-Public/trigger-circleci-pipeline-action@v1.2.0
        env:
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
